				post_title2: "Data-Driven Molecular Applications",
				post_subtitle: "Representations optimized for modeling workflows",
				post_elements: [
					["p","Molecular structures can be encoded in several complementary ways, and the appropriate representation depends on the intended analysis. Our Molecular Description service establishes this computational layer from the underlying chemical structure, producing standardized representations that can support similarity analysis, chemical space exploration, virtual screening and predictive modelling."],
					
					["p","For descriptor based workflows, we generate physicochemical and structural descriptors together with molecular fingerprints. These representations capture properties such as molecular size, composition, polarity, topology and recurring substructures, providing compact feature spaces for quantitative analysis, similarity assessment and conventional machine learning."],

					["p","When molecular connectivity is central to the modelling task, structures can be encoded as molecular graphs. Atoms form nodes and bonds form edges, while additional atomic and bond attributes preserve relevant chemical information. This representation provides a direct input format for graph based modelling and allows structural relationships to remain explicit during analysis."],

					["p","Molecules can also be represented as sequences, including standardized SMILES based encodings. These compact structural descriptions are suitable for sequence based models, while learned embeddings can encode recurring molecular fragments and relationships within their chemical context."],

					["p","These approaches provide different computational views of the same chemical structure. We select the representation according to the analytical objective, dataset characteristics and modelling strategy. Descriptors, fingerprints, graphs and learned representations can therefore be used independently or evaluated as complementary inputs when appropriate."],

					["p","The resulting molecular description forms a consistent interface between chemical structure and downstream computation. It provides the standardized, machine readable molecular information required for subsequent modelling, prediction, similarity assessment and discovery workflows."]
				]
			};

		<script>
			function createParagraph(text, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.textContent = text;
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newHr = document.createElement("hr");
				newHr.classList = ["mx-auto"]
				newHr.style = "max-width: 250px;"

				if (index==0) {
					post.appendChild(newBr1);
					post.appendChild(newHr);
					post.appendChild(newBr2);
				}
				post.appendChild(newDiv);
				post.appendChild(newBr3);
			}

			function createImage(url, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.classList = ["row","justify-content-center"]
				const newImg = document.createElement("img");
				newImg.src = url;
				newImg.style = "width: 100%;"
				newImg.classList = ["img-fluid"]
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newBr4 = document.createElement("br");
				const newHr1 = document.createElement("hr");
				newHr1.classList = ["mx-auto"]
				newHr1.style = "max-width: 250px;"
				const newHr2 = document.createElement("hr");
				newHr2.classList = ["mx-auto"]
				newHr2.style = "max-width: 250px;"
				
				if (index==0) {
					post.appendChild(newBr1);
				}
				post.appendChild(newHr1);
				post.appendChild(newBr2);
				newDiv.appendChild(newImg)
				post.appendChild(newDiv);
				post.appendChild(newBr3);
				post.appendChild(newHr2);
				post.appendChild(newBr4);
			}

			function createElement(category, data, index=-1) {
				console.log(index)
				console.log(category)
				console.log(data)

				if (category=="p") {
					createParagraph(data,index)
				}
				else if (category=="i") {
					createImage(data)
				}
			}
