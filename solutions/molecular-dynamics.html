				post_elements: [
					["p","Molecular structures are dynamic systems rather than fixed arrangements of atoms. Molecular Dynamics simulations provide a computational view of this motion by calculating how atoms evolve over time under defined physical conditions, revealing conformational changes that are difficult to infer from a static structure alone."],

					["p","We use Molecular Dynamics to investigate structural flexibility, conformational stability and interactions between molecules. Simulations can reveal transient states, local rearrangements and changes in molecular contacts that may influence recognition, binding or overall structural behaviour."],

					["p","The resulting trajectories are analysed through quantitative descriptors such as root mean square deviation, root mean square fluctuation, radius of gyration and interaction patterns. These measurements transform complex atomic motion into interpretable evidence about the behaviour of the system."],

					["p","For drug discovery and molecular engineering, this perspective can complement structural modelling and docking by testing whether predicted complexes remain stable during simulation. It can also help identify regions of flexibility and interactions that may warrant further investigation."],

					["p","At Modalis, Molecular Dynamics usually forms part of a broader computational workflow connecting molecular representation, docking, simulation and machine learning. The objective is to move beyond static predictions and obtain a more complete understanding of molecular behaviour."]

		<script>
			function createParagraph(text, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.textContent = text;
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newHr = document.createElement("hr");
				newHr.classList = ["mx-auto"]
				newHr.style = "max-width: 250px;"

				if (index==0) {
					post.appendChild(newBr1);
					post.appendChild(newHr);
					post.appendChild(newBr2);
				}
				post.appendChild(newDiv);
				post.appendChild(newBr3);
			}

			function createImage(url, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.classList = ["row","justify-content-center"]
				const newImg = document.createElement("img");
				newImg.src = url;
				newImg.style = "width: 100%;"
				newImg.classList = ["img-fluid"]
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newBr4 = document.createElement("br");
				const newHr1 = document.createElement("hr");
				newHr1.classList = ["mx-auto"]
				newHr1.style = "max-width: 250px;"
				const newHr2 = document.createElement("hr");
				newHr2.classList = ["mx-auto"]
				newHr2.style = "max-width: 250px;"
				
				if (index==0) {
					post.appendChild(newBr1);
				}
				post.appendChild(newHr1);
				post.appendChild(newBr2);
				newDiv.appendChild(newImg)
				post.appendChild(newDiv);
				post.appendChild(newBr3);
				post.appendChild(newHr2);
				post.appendChild(newBr4);
			}

			function createElement(category, data, index=-1) {
				console.log(index)
				console.log(category)
				console.log(data)

				if (category=="p") {
					createParagraph(data,index)
				}
				else if (category=="i") {
					createImage(data)
				}
			}
