				post_title1: "Better Experiments",
				post_title2: "Better Decisions",
				post_subtitle: "A systematic approach to learning more from every experimental run with greater efficiency",

				post_elements: [
					["p","Experimental development becomes inefficient when variables are investigated independently. Design of Experiments allows multiple factors to be studied together, revealing which variables influence the response and where interactions between them become important. This replaces fragmented experimentation with a structured experimental strategy."],

					["p","We begin by translating the scientific objective into measurable responses, relevant factors and meaningful experimental ranges. The design is then selected according to the question being addressed, whether the objective is factor screening, process understanding, optimization or robustness assessment. This establishes the experimental space before resources are committed to individual runs."],

					["p","The resulting data are analysed using statistical models that connect experimental factors with observed responses. These models provide quantitative insight into main effects, interactions and process behaviour, allowing experimental results to be interpreted as a coherent system rather than as isolated observations."],

					["p","For development workflows, this approach can be used to identify critical process parameters, understand their relationship with critical quality attributes and define regions in which the desired performance is achieved. Factorial, response surface and mixture designs provide different ways of exploring these relationships according to the structure of the problem."],

					["p","The important result is not simply fewer experiments. It is more information per experiment. By combining experimental design with statistical modelling and computational analysis, each experiment contributes to a progressively clearer representation of the system and helps determine where further investigation will provide the greatest value."],

					["p","At Modalis, we usually integrate Design of Experiments with our broader computational capabilities to connect experimentation, modelling and decision making. The objective is a practical development process in which experimental resources are directed toward the questions that matter most."]
				]
			};

		<script>
			function createParagraph(text, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.textContent = text;
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newHr = document.createElement("hr");
				newHr.classList = ["mx-auto"]
				newHr.style = "max-width: 250px;"

				if (index==0) {
					post.appendChild(newBr1);
					post.appendChild(newHr);
					post.appendChild(newBr2);
				}
				post.appendChild(newDiv);
				post.appendChild(newBr3);
			}

			function createImage(url, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.classList = ["row","justify-content-center"]
				const newImg = document.createElement("img");
				newImg.src = url;
				newImg.style = "width: 100%;"
				newImg.classList = ["img-fluid"]
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newBr4 = document.createElement("br");
				const newHr1 = document.createElement("hr");
				newHr1.classList = ["mx-auto"]
				newHr1.style = "max-width: 250px;"
				const newHr2 = document.createElement("hr");
				newHr2.classList = ["mx-auto"]
				newHr2.style = "max-width: 250px;"
				
				if (index==0) {
					post.appendChild(newBr1);
				}
				post.appendChild(newHr1);
				post.appendChild(newBr2);
				newDiv.appendChild(newImg)
				post.appendChild(newDiv);
				post.appendChild(newBr3);
				post.appendChild(newHr2);
				post.appendChild(newBr4);
			}

			function createElement(category, data, index=-1) {
				console.log(index)
				console.log(category)
				console.log(data)

				if (category=="p") {
					createParagraph(data,index)
				}
				else if (category=="i") {
					createImage(data)
				}
			}
