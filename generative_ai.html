				post_elements: [
					["p","Generative AI provides a computational approach to exploring chemical space by constructing molecular structures that satisfy defined design objectives. Instead of evaluating only existing compounds, generative models can propose new candidates with combinations of properties that may be difficult to identify through conventional screening alone."],

					["p","Our approach incorporates molecular representations, learned chemical patterns and project specific objectives to guide the generation process. Desired characteristics can include predicted biological activity, physicochemical properties, ADMET behaviour or other molecular constraints relevant to the intended discovery programme."],

					["p","Generated molecules are evaluated computationally before experimental consideration. Structural validity, predicted properties, similarity to known chemistry and other project specific criteria can be combined to prioritize candidates and focus attention on molecules with a stronger overall development profile."],

		<script>
			function createParagraph(text, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.textContent = text;
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newHr = document.createElement("hr");
				newHr.classList = ["mx-auto"]
				newHr.style = "max-width: 250px;"

				if (index==0) {
					post.appendChild(newBr1);
					post.appendChild(newHr);
					post.appendChild(newBr2);
				}
				post.appendChild(newDiv);
				post.appendChild(newBr3);
			}

			function createImage(url, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.classList = ["row","justify-content-center"]
				const newImg = document.createElement("img");
				newImg.src = url;
				newImg.style = "width: 100%;"
				newImg.classList = ["img-fluid"]
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newBr4 = document.createElement("br");
				const newHr1 = document.createElement("hr");
				newHr1.classList = ["mx-auto"]
				newHr1.style = "max-width: 250px;"
				const newHr2 = document.createElement("hr");
				newHr2.classList = ["mx-auto"]
				newHr2.style = "max-width: 250px;"
				
				if (index==0) {
					post.appendChild(newBr1);
				}
				post.appendChild(newHr1);
				post.appendChild(newBr2);
				newDiv.appendChild(newImg)
				post.appendChild(newDiv);
				post.appendChild(newBr3);
				post.appendChild(newHr2);
				post.appendChild(newBr4);
			}

			function createElement(category, data, index=-1) {
				console.log(index)
				console.log(category)
				console.log(data)

				if (category=="p") {
					createParagraph(data,index)
				}
				else if (category=="i") {
					createImage(data)
				}
			}

			document.querySelectorAll(".post_title2").forEach(el => {

			});
			document.querySelectorAll(".post_subtitle").forEach(el => {

			});
			var post = document.getElementById("post");
			for (let i = 0; i < content.post_elements.length; i++) {
				createElement(content.post_elements[i][0], content.post_elements[i][1], i)
