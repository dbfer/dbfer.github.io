				post_title1: "From Chemical Data",
				post_title2: "to Structured Information",
				post_subtitle: "Consistent, searchable and reusable chemical information",
				post_elements: [
					["p","Chemical databases are useful only when the underlying records can be interpreted consistently. Our database systems therefore begin with structured data ingestion, validation and normalization. Molecular structures, identifiers, annotations and experimental measurements are transformed into a consistent internal representation so that records originating from different sources can be queried and compared reliably. This includes structure standardization and controlled handling of identifiers, synonyms and molecular records."],

					["p","We organize chemical information around linked entities rather than isolated tables. Molecular structures can be connected with identifiers, physicochemical properties, biological targets, assays, experimental results, publications and other relevant annotations. This structure preserves relationships between data types while allowing individual components to be updated, extended or queried independently."],

					["p","The database layer can support chemical structure retrieval in addition to conventional text and attribute queries. Depending on the application, records may be searched by exact identity, structural similarity, substructure or other chemically defined criteria. This makes the database an active analytical component rather than simply a repository for stored molecular records."],

					["p","Information assembled from multiple sources rarely uses identical identifiers, naming conventions or data structures. We therefore implement mapping and integration procedures that connect equivalent records while preserving their provenance. The resulting system can combine internal datasets with external chemical, biological or literature derived information without discarding the distinctions between source records."],

					["p","Curation is incorporated into the database architecture rather than treated as a final cleaning step. Records can retain source information, version history and relevant quality information, allowing the origin and processing state of a data item to remain traceable. This provides a more reliable basis for downstream analysis and reduces ambiguity when datasets are expanded or revised."],

					["p","The resulting database system provides a structured foundation for computational work. It can support repeated queries, dataset construction, molecular analysis and integration with modelling pipelines while remaining extensible as new compounds, measurements and annotations become available. The objective is a dependable data layer that turns heterogeneous chemical information into an accessible and reusable scientific resource."]
				]

		<script>
			function createParagraph(text, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.textContent = text;
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newHr = document.createElement("hr");
				newHr.classList = ["mx-auto"]
				newHr.style = "max-width: 250px;"

				if (index==0) {
					post.appendChild(newBr1);
					post.appendChild(newHr);
					post.appendChild(newBr2);
				}
				post.appendChild(newDiv);
				post.appendChild(newBr3);
			}

			function createImage(url, index=-1) {
				const newDiv = document.createElement("div");
				newDiv.classList = ["row","justify-content-center"]
				const newImg = document.createElement("img");
				newImg.src = url;
				newImg.style = "width: 100%;"
				newImg.classList = ["img-fluid"]
				const newBr1 = document.createElement("br");
				const newBr2 = document.createElement("br");
				const newBr3 = document.createElement("br");
				const newBr4 = document.createElement("br");
				const newHr1 = document.createElement("hr");
				newHr1.classList = ["mx-auto"]
				newHr1.style = "max-width: 250px;"
				const newHr2 = document.createElement("hr");
				newHr2.classList = ["mx-auto"]
				newHr2.style = "max-width: 250px;"
				
				if (index==0) {
					post.appendChild(newBr1);
				}
				post.appendChild(newHr1);
				post.appendChild(newBr2);
				newDiv.appendChild(newImg)
				post.appendChild(newDiv);
				post.appendChild(newBr3);
				post.appendChild(newHr2);
				post.appendChild(newBr4);
			}

			function createElement(category, data, index=-1) {
				console.log(index)
				console.log(category)
				console.log(data)

				if (category=="p") {
					createParagraph(data,index)
				}
				else if (category=="i") {
					createImage(data)
				}
			}
